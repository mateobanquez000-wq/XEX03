name: Compilar XEX03

on:
  push:
  workflow_dispatch:

jobs:
  # Pruebas del motor de audio (rapidas, en Linux)
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y ejecutar pruebas del motor
        run: |
          g++ -O2 -std=c++17 tests/test_engine.cpp -o test_engine
          ./test_engine

  # Plugin VST3 para Windows (FL Studio)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCOPY_AFTER_BUILD=OFF

      - name: Compilar
        run: cmake --build build --config Release

      - name: Subir el plugin
        uses: actions/upload-artifact@v4
        with:
          name: XEX03-VST3-Windows
          path: build/XEX03_artefacts/Release/VST3
